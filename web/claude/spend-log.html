<title>花費紀錄帳本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column ledger — total + category split, entry form, yearly bars, item table. Same shell as 股票損益帳本. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#1b2230; --muted:#667085; --line:#e3e6ec;
  --accent:#2f4b7c; --c1:#c2577a; --c2:#a07a2c; --c3:#4f7aa8; --c4:#7a6aa8; --danger:#c43c3c;
  --f-body:"Noto Sans TC",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --ink:#e7eaf0; --muted:#98a2b3; --line:#2b3340;
  --accent:#8fb0e8; --c1:#e5859f; --c2:#d4ad5e; --c3:#80a9d6; --c4:#a99ad6; --danger:#f07070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --ink:#e7eaf0; --muted:#98a2b3; --line:#2b3340;
  --accent:#8fb0e8; --c1:#e5859f; --c2:#d4ad5e; --c3:#80a9d6; --c4:#a99ad6; --danger:#f07070; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
h1{font-size:24px;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.status{font-size:13px;color:var(--muted)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;grid-template-columns:1.1fr 2fr;gap:24px}
.big-label{font-size:13px;color:var(--muted);letter-spacing:.04em}
.big{font-size:38px;font-weight:600;line-height:1.1;margin-top:4px}
.split{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.stack span{height:100%}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 18px;margin:0}
.cat dt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.cat dd{margin:2px 0 0;font-size:18px;font-weight:500}
.cat dd small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
section h2{font-size:15px;margin:0 0 10px;font-weight:700}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr 1.6fr 1fr 1.1fr;gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.wide{grid-column:1/4}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px}
.actions button{flex:1;white-space:nowrap}
form.editing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
tr.editing td{background:var(--bg)}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}
.formmsg{grid-column:1/-1;font-size:13px;min-height:1em;margin:0}
.years{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.yrow{display:grid;grid-template-columns:64px 1fr 96px;gap:10px;align-items:center;font-size:13px}
.ytrack{display:flex;height:14px;border-radius:3px;overflow:hidden}
.ytrack span{height:100%}
.r{text-align:right}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:13px;padding:4px 12px;border-radius:99px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--bg)}
td.nowrap,th.nowrap{white-space:nowrap}
td.note{color:var(--muted);font-size:13px;max-width:320px}
tr:last-child td{border-bottom:none}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.del{font-size:12px;padding:3px 9px;color:var(--muted)}
.del.confirm{color:var(--danger);border-color:var(--danger)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  form{grid-template-columns:1fr 1fr}
  label.wide{grid-column:1/-1}
  form .actions{grid-column:1/-1}
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>花費紀錄帳本</h1>
      <div class="sub">醫美、奢侈品與其它大額花費，單位 NT$（實際淨支出）。</div>
    </div>
    <div class="status" id="status">連線中…</div>
  </header>

  <div class="hero">
    <div>
      <div class="big-label">總支出</div>
      <div class="big num" id="total">—</div>
      <div class="sub" id="count">尚無資料</div>
    </div>
    <div class="split">
      <div class="stack" id="stack" aria-hidden="true"></div>
      <dl class="cats" id="cats"></dl>
    </div>
  </div>

  <section>
    <h2 id="form-title">新增花費</h2>
    <form id="form" autocomplete="off">
      <label for="f-cat">類別<input id="f-cat" list="cat-list" required placeholder="醫美 / 奢侈品 / 其它"></label>
      <label for="f-item">項目<input id="f-item" required placeholder="例：Ulthera 美國音波 600發"></label>
      <label for="f-amt">金額 (NT$)<input id="f-amt" type="number" min="0" step="1" required placeholder="34000"></label>
      <label for="f-date">日期（可留空）<input id="f-date" type="date"></label>
      <label for="f-note" class="wide">備註（可留空）<input id="f-note" placeholder="例：含刷卡手續費，已扣退稅"></label>
      <div class="actions"><button class="primary" id="f-submit" type="submit">新增</button><button type="button" id="f-cancel" hidden>取消</button></div>
      <p class="formmsg" id="formmsg" role="status"></p>
      <datalist id="cat-list"><option value="醫美"></option><option value="奢侈品"></option><option value="其它"></option></datalist>
    </form>
  </section>

  <section>
    <h2>每年支出</h2>
    <div class="years" id="years"><div class="empty">有日期的花費會依年份顯示在這裡。</div></div>
  </section>

  <section>
    <h2>花費明細</h2>
    <div class="filters" id="filters"></div>
    <div class="tablebox">
      <table>
        <thead><tr><th class="nowrap">日期</th><th>類別</th><th>項目</th><th class="r nowrap">金額 (NT$)</th><th>備註</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">正在載入花費紀錄…</td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("en-US");
const BASE = ["醫美","奢侈品","其它"], PALETTE = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)"];
let items = [], db = null, canWrite = true, armed = null, filter = "全部", editing = null;

function catsOf(list){ const extra=[...new Set(list.map(t=>t.cat))].filter(c=>!BASE.includes(c)).sort(); return [...BASE,...extra]; }
function color(cat, cats){ const i=cats.indexOf(cat); return PALETTE[Math.min(i<0?3:i,3)]; }
function showDate(d){ return d ? d.replaceAll("-","/") : "—"; }

function render(){
  const cats = catsOf(items);
  const total = items.reduce((s,t)=>s+t.amount,0);
  $("total").textContent = items.length ? fmt(total) : "—";
  $("count").textContent = items.length ? `共 ${items.length} 筆` : "尚無資料";
  const sums = Object.fromEntries(cats.map(c=>[c, items.filter(t=>t.cat===c).reduce((s,t)=>s+t.amount,0)]));
  const stack=$("stack"), dl=$("cats"); stack.textContent=""; dl.textContent="";
  for (const c of cats){
    const n = items.filter(t=>t.cat===c).length; if (!n && !BASE.includes(c)) continue;
    const pct = total ? sums[c]/total*100 : 0;
    const seg=document.createElement("span"); seg.style.width=pct+"%"; seg.style.background=color(c,cats); stack.appendChild(seg);
    const d=document.createElement("div"); d.className="cat";
    const dt=document.createElement("dt"); const dot=document.createElement("span"); dot.className="dot"; dot.style.background=color(c,cats); dt.append(dot, c+` · ${n} 筆`);
    const dd=document.createElement("dd"); dd.className="num"; dd.textContent=fmt(sums[c]); const sm=document.createElement("small"); sm.textContent=pct.toFixed(1)+"%"; dd.appendChild(sm);
    d.append(dt,dd); dl.appendChild(d);
  }

  const fb=$("filters"); fb.textContent="";
  for (const c of ["全部",...cats]){ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=c; b.setAttribute("aria-pressed", String(filter===c)); b.onclick=()=>{filter=c;render();}; fb.appendChild(b); }

  const list = items.filter(t=>filter==="全部"||t.cat===filter).sort((a,b)=>{
    if (!a.date && b.date) return 1; if (a.date && !b.date) return -1;
    return (b.date||"").localeCompare(a.date||"") || (b.created||0)-(a.created||0);
  });
  const tb=$("rows"); tb.textContent="";
  if (!list.length){ tb.innerHTML='<tr><td colspan="6" class="empty">'+(items.length?"這個類別還沒有花費。":"還沒有花費。用上方表單新增第一筆。")+'</td></tr>'; }
  for (const t of list){
    const tr=document.createElement("tr"); if (editing===t.id) tr.className="editing";
    const td=(txt,c)=>{const e=document.createElement("td"); if(c) e.className=c; e.textContent=txt; tr.appendChild(e); return e;};
    td(showDate(t.date),"num nowrap");
    const ct=document.createElement("td"); const tag=document.createElement("span"); tag.className="tag"; const dot=document.createElement("span"); dot.className="dot"; dot.style.background=color(t.cat,cats); tag.append(dot,t.cat); ct.appendChild(tag); tr.appendChild(ct);
    td(t.item);
    td(fmt(t.amount),"r num nowrap");
    td(t.note||"","note");
    const a=document.createElement("td"); a.className="r";
    if (canWrite && db){
      const w=document.createElement("div"); w.className="rowbtns";
      const e=document.createElement("button"); e.type="button"; e.className="del"; e.textContent="編輯"; e.onclick=()=>startEdit(t); w.appendChild(e);
      const b=document.createElement("button"); b.type="button"; b.className="del"+(armed===t.id?" confirm":""); b.textContent=armed===t.id?"確定刪除？":"刪除"; b.onclick=()=>onDelete(t.id); w.appendChild(b);
      a.appendChild(w);
    }
    tr.appendChild(a); tb.appendChild(tr);
  }

  const yb=$("years"); yb.textContent="";
  const dated = items.filter(t=>t.date); const undated = items.length - dated.length;
  const ys = [...new Set(dated.map(t=>t.date.slice(0,4)))].sort();
  if (!ys.length){ yb.innerHTML='<div class="empty">有日期的花費會依年份顯示在這裡。</div>'; return; }
  const ytot = Object.fromEntries(ys.map(y=>[y, dated.filter(t=>t.date.startsWith(y)).reduce((s,t)=>s+t.amount,0)]));
  const max = Math.max(...Object.values(ytot));
  for (const y of ys){
    const row=document.createElement("div"); row.className="yrow";
    const l=document.createElement("span"); l.className="num"; l.textContent=y;
    const wrapT=document.createElement("div"); const trk=document.createElement("div"); trk.className="ytrack"; trk.style.width=(ytot[y]/max*100)+"%";
    for (const c of cats){ const s=dated.filter(t=>t.date.startsWith(y)&&t.cat===c).reduce((a,t)=>a+t.amount,0); if(!s) continue; const seg=document.createElement("span"); seg.style.width=(s/ytot[y]*100)+"%"; seg.style.background=color(c,cats); seg.title=`${c} ${fmt(s)}`; trk.appendChild(seg); }
    wrapT.appendChild(trk);
    const v=document.createElement("span"); v.className="num r"; v.textContent=fmt(ytot[y]);
    row.append(l,wrapT,v); yb.appendChild(row);
  }
  if (undated){ const n=document.createElement("div"); n.className="sub"; n.textContent=`另有 ${undated} 筆沒有日期（${fmt(items.filter(t=>!t.date).reduce((s,t)=>s+t.amount,0))}），未列入年份。`; yb.appendChild(n); }
}

function startEdit(t){
  editing=t.id;
  $("f-cat").value=t.cat; $("f-item").value=t.item; $("f-amt").value=t.amount;
  $("f-date").value=/^\d{4}-\d{2}-\d{2}$/.test(t.date||"")?t.date:""; $("f-note").value=t.note||"";
  $("form-title").textContent=`編輯：${t.item}`; $("f-submit").textContent="儲存修改"; $("f-cancel").hidden=false;
  $("form").classList.add("editing");
  $("formmsg").textContent=(t.date&&!/^\d{4}-\d{2}-\d{2}$/.test(t.date))?`原本日期只有「${t.date.replace("-","/")}」；日期欄留空會保留原樣。`:"";
  render(); $("form").scrollIntoView({behavior:"smooth",block:"center"}); $("f-date").focus({preventScroll:true});
}
function endEdit(){
  editing=null; $("form-title").textContent="新增花費"; $("f-submit").textContent="新增"; $("f-cancel").hidden=true;
  $("form").classList.remove("editing"); $("f-item").value=""; $("f-amt").value=""; $("f-note").value=""; $("f-date").value=""; render();
}
$("f-cancel").addEventListener("click",()=>{ endEdit(); $("formmsg").textContent=""; });

async function onDelete(id){
  if (armed !== id){ armed=id; render(); setTimeout(()=>{ if(armed===id){armed=null;render();} },4000); return; }
  armed=null;
  try { await db.collection("expenses").doc(id).delete(); }
  catch(e){ $("formmsg").textContent="刪除失敗，請稍後再試。"; }
}

$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg=$("formmsg");
  if (!db){ msg.textContent="目前無法連到資料庫，花費沒有存下來。"; return; }
  const cat=$("f-cat").value.trim(), item=$("f-item").value.trim(), amount=Math.round(Number($("f-amt").value)), date=$("f-date").value, note=$("f-note").value.trim();
  if (!cat||!item||!Number.isFinite(amount)||amount<0){ msg.textContent="請填類別、項目和金額。"; return; }
  $("f-submit").disabled=true;
  try {
    if (editing){
      const old=items.find(t=>t.id===editing);
      const keepDate = !date && old && old.date && !/^\d{4}-\d{2}-\d{2}$/.test(old.date) ? old.date : (date||"");
      await db.collection("expenses").doc(editing).update({cat,item,amount,date:keepDate,note});
      endEdit(); msg.textContent=`已儲存 ${cat}：${item} ${fmt(amount)}`; return;
    }
    await db.collection("expenses").add({cat,item,amount,date:date||"",note,created:Date.now()});
    msg.textContent=`已新增 ${cat}：${item} ${fmt(amount)}`;
    $("f-item").value=""; $("f-amt").value=""; $("f-note").value=""; $("f-item").focus();
  } catch(err){
    if (err && err.code==="invalid_argument"){ canWrite=false; msg.textContent="你沒有編輯權限，只能查看。"; render(); }
    else msg.textContent="儲存失敗，請稍後再試。";
  } finally { $("f-submit").disabled=false; }
});

(async ()=>{
  db = await window.claude?.use?.("db") ?? null;
  if (!db){ $("status").textContent="無法連到資料庫（請登入後開啟）"; $("rows").innerHTML='<tr><td colspan="6" class="empty">登入後才能看到花費紀錄。</td></tr>'; return; }
  const user = await window.claude.use("user");
  if (user){ try { const c=await user.can("data.write"); if (c===false){ canWrite=false; $("f-submit").disabled=true; $("formmsg").textContent="你只有檢視權限。"; } } catch(e){} }
  const timer=setTimeout(()=>{ $("status").textContent="資料暫時無法連線，顯示內容可能不是最新"; },10000);
  db.collection("expenses").onSnapshot(snap=>{
    if (!snap.metadata.fromCache){ clearTimeout(timer); $("status").textContent="已同步 · 自動儲存"; }
    items = snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>typeof t.amount==="number" && typeof t.cat==="string");
    render();
  }, ()=>{ clearTimeout(timer); $("status").textContent="資料連線中斷，請重新整理頁面"; });
})();
</script>
